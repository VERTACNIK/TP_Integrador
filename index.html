<!DOCTYPE html>

    <script>
        let cindex = 0;
        let chref;
        let ctrans;
        let cimg;
        let ctxt;

        document.addEventListener("DOMContentLoaded", start);

        function start() {
            chref = document.getElementsByClassName("cHref");
            ctrans = document.getElementsByClassName("cTransition");
            cimg = document.getElementsByClassName("cImg");
            ctxt = document.getElementsByClassName("cTxt");
            carruselChange();
        }

        function carruselIndex() {
            ctrans[0].classList.add("show");
            cindex++;
            if (cindex >= 4) {cindex = 0;}
            setTimeout(carruselChange, 1285);
        }

        function carruselChange() {
            ctrans[0].classList.remove("show");

            if (cindex == 0) {
                chref[0].setAttribute("href", "pagina1.html");
                cimg[0].setAttribute("src", "./assets/img/icono.png");
                ctxt[0].innerHTML = `
                    <h2>Título de la primera noticia</h2>
                    <h3>Descripción de la primera noticia</h3>
                `;
            }

            if (cindex == 1) {
                chref[0].setAttribute("href", "pagina2.html");
                cimg[0].setAttribute("src", "./assets/img/icono.png");
                ctxt[0].innerHTML = `
                    <h2>Título de la segunda noticia</h2>
                    <h3>Descripción de la segunda noticia</h3>
                `;
            }

            if (cindex == 2) {
                chref[0].setAttribute("href", "pagina3.html");
                cimg[0].setAttribute("src", "./assets/img/icono.png");
                ctxt[0].innerHTML = `
                    <h2>Título de la tercera noticia</h2>
                    <h3>Descripción de la tercera noticia</h3>
                `;
            }

            if (cindex == 3) {
                chref[0].setAttribute("href", "pagina4.html");
                cimg[0].setAttribute("src", "./assets/img/icono.png");
                ctxt[0].innerHTML = `
                    <h2>Título de la cuarta noticia</h2>
                    <h3>Descripción de la cuarta noticia</h3>
                `;
            }

            setTimeout(carruselIndex, 7000);
        }
    </script>
